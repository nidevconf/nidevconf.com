# The agenda API: anonymous counts of who hearted what, and the organisers'
# admin page. The site itself stays on GitHub Pages; see README "My agenda".
name = "nidevconf-agenda"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# the admin page is one HTML file bundled into the Worker as a string
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[vars]
SITE = "https://nidevconf.com"
ORIGINS = "https://nidevconf.com,http://localhost:3000"
# Organiser sign-in lives in Worker secrets, not here, because this repo is
# public: ACCESS_TEAM_DOMAIN and ACCESS_AUD (Cloudflare Access with Google
# login), or ADMIN_KEY until Access is set up. See README "My agenda".

[[d1_databases]]
binding = "DB"
database_name = "nidevconf-agenda"
# from `npx wrangler d1 create nidevconf-agenda`
database_id = "00000000-0000-0000-0000-000000000000"

# 30 syncs a minute per IP is plenty for a person and slows down anyone
# trying to stuff the counts
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
